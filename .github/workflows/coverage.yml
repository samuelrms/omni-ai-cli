name: Coverage

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the tests, so it gets no write access: code under test can't reach a token that pushes
  measure:
    runs-on: ubuntu-latest
    outputs:
      percent: ${{ steps.measure.outputs.percent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Measure coverage
        id: measure
        run: |
          pip install --require-hashes -r .github/release-tools/requirements-coverage.txt
          coverage run --source=omni_ai --omit='omni_ai/vendor/*' -m unittest discover -s tests
          coverage report
          pct=$(coverage report | awk '/^TOTAL/{print $NF}' | tr -d '%')
          echo "percent=$pct" >> "$GITHUB_OUTPUT"

  # Writes the badge and runs nothing from the repository
  badge:
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish coverage badge
        env:
          PCT: ${{ needs.measure.outputs.percent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PCT" =~ ^[0-9]{1,3}$ ]] || { echo "::error::not a percentage: $PCT"; exit 1; }
          if [ "$PCT" -ge 90 ]; then color=brightgreen
          elif [ "$PCT" -ge 75 ]; then color=green
          elif [ "$PCT" -ge 60 ]; then color=yellow
          else color=orange; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color" > coverage.json
          git init -q badges && cd badges
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin badges; then git checkout -q -b badges FETCH_HEAD; else git checkout -q --orphan badges; fi
          cp ../coverage.json coverage.json
          git add coverage.json
          git commit -q -m "chore: update coverage badge [skip ci]" || { echo "no change"; exit 0; }
          git push -q origin badges
