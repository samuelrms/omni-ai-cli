name: Publish extension

on:
  workflow_dispatch:   # manual only; automatic publishing is a job in release.yml

permissions:
  contents: read
  id-token: write   # for VS Code Marketplace OIDC, when available

jobs:
  publish:
    name: Publish the editor extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix ../tools/release
          echo "$PWD/../tools/release/node_modules/.bin" >> "$GITHUB_PATH"
      # On a release, use its tag; on a manual run, use the latest release tag
      # so the package never ships the placeholder version from the repo.
      - name: Match the released version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName | sed 's/^v//')"
          fi
          echo "Publishing version $v"
          npm version "$v" --no-git-tag-version --allow-same-version
      # Keep the store's "Changes" tab fresh from the GitHub releases.
      - name: Refresh changelog from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Changelog"
            echo
            echo "History of the Omni AI CLI editor extension (shares its version with the npm package)."
            echo
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body
              echo
            done
          } > CHANGELOG.md
      - name: Package
        run: vsce package --no-dependencies -o omni-ai-cli.vsix
      # Open VSX (Cursor) first and on its own, so a Marketplace hiccup never blocks it.
      - name: Check Open VSX token
        id: ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::OVSX_PAT not set; skipping Open VSX."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish to Open VSX
        if: steps.ovsx.outputs.present == 'true'
        continue-on-error: true   # an "already published" conflict must never block the Marketplace step
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: ovsx publish omni-ai-cli.vsix -p "$OVSX_PAT"
      # VS Code Marketplace: prefer a PAT (VSCE_PAT); otherwise try OIDC. Never fails the whole run.
      - name: Publish to VS Code Marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            vsce publish --no-dependencies --packagePath omni-ai-cli.vsix -p "$VSCE_PAT"
          else
            echo "::warning::VSCE_PAT not set; trying OIDC trusted publishing."
            vsce publish --no-dependencies --packagePath omni-ai-cli.vsix --oidc
          fi
