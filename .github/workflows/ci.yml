name: CI

on:
  pull_request:
  push:
    branches: [main, next, beta]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell installer syntax
        run: bash -n scripts/install.sh

  windows:
    name: Windows shims (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tool launch on real Windows
        run: python -m unittest discover -s tests -p 'test_windows_*.py' -v
      - name: Editor extension starts the CLI on real Windows
        run: node --test editor/test/launch.test.js

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and startup checks
        run: bash scripts/docker-smoke.sh

  release-tools:
    name: Release tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # An update to these tools (Dependabot) must not break the next release: run them without publishing
      - name: Release tools work
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/release
          node tools/release/check.mjs

  package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Launcher syntax
        run: node --check bin/ai.js
      - name: Editor extension syntax
        run: |
          node --check editor/extension.js
          node --check editor/launch.js
          node -e "JSON.parse(require('fs').readFileSync('editor/package.json','utf8'))"
          node --test editor/test/safety.test.js
          node --test editor/test/launch.test.js
      - name: Pack
        run: npm pack --dry-run
      - name: Install tarball and run launcher
        run: |
          npm pack
          npm install -g --omit=optional ./omni-ai-cli-*.tgz
          ai --help
