name: CI

on:
  pull_request:
  push:
    branches: [main, next, beta]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell installer syntax
        run: bash -n scripts/install.sh

  windows:
    name: Windows shims (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tool launch on real Windows
        run: python -m unittest discover -s tests -p 'test_windows_*.py' -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and startup checks
        run: bash scripts/docker-smoke.sh

  package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Launcher syntax
        run: node --check bin/ai.js
      - name: Editor extension syntax
        run: |
          node --check editor/extension.js
          node -e "JSON.parse(require('fs').readFileSync('editor/package.json','utf8'))"
          node --test editor/test/safety.test.js
      - name: Pack
        run: npm pack --dry-run
      - name: Install tarball and run launcher
        run: |
          npm pack
          npm install -g --omit=optional ./omni-ai-cli-*.tgz
          ai --help
