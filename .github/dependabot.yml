version: 2
updates:
  # Keeps the SHA pins of the workflows current, with the version in the comment
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  # The tools the release and coverage workflows run. Outside .github: Dependabot cannot open
  # pull requests that change files there for these ecosystems.
  - package-ecosystem: npm
    directory: /tools/release
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /tools/release
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
