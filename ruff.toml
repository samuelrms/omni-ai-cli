# Lint only, for mistakes rather than style: syntax errors, undefined names, unused imports and variables
target-version = "py311"
extend-exclude = ["omni_ai/vendor"]  # third-party code, kept as published

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# Package __init__ files re-export their submodules' names on purpose
"**/__init__.py" = ["F401"]
